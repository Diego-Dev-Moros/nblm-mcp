[project]
name = "nblm-mcp"
version = "0.1.0"
description = "MCP server for Google NotebookLM (Gemini Notebook) — notebooks, sources, grounded chat with citations, and Studio artifacts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "diego-dev-moros", url = "https://github.com/diego-dev-moros" }]
keywords = ["mcp", "notebooklm", "gemini-notebook", "google", "fastmcp", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.0,<4",
    "notebooklm-py>=0.8.1,<0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Browser login (`nblm-mcp-login`) drives Playwright through notebooklm-py.
auth = ["notebooklm-py[browser]>=0.8.1,<0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/diego-dev-moros/nblm-mcp"
Repository = "https://github.com/diego-dev-moros/nblm-mcp"
Issues = "https://github.com/diego-dev-moros/nblm-mcp/issues"

[project.scripts]
nblm-mcp = "nblm_mcp.server:main"
nblm-mcp-login = "nblm_mcp.cli:login_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nblm_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
